<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="rgba(13,155,174,0.12)"/>
    </pattern>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(15,42,74,0.90)"/>
      <stop offset="60%" stop-color="rgba(15,42,74,0.70)"/>
      <stop offset="100%" stop-color="rgba(13,155,174,0.40)"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="#1A1A2E"/>
  <rect width="1080" height="1080" fill="url(#dotgrid)"/>

  <!-- Mock screenshot: pricing table -->
  <rect x="40" y="180" width="1000" height="560" rx="12" fill="#1E293B"/>
  <rect x="40" y="180" width="1000" height="560" rx="12" fill="url(#overlay)"/>

  <!-- Screenshot header mockup -->
  <rect x="60" y="200" width="960" height="40" rx="6" fill="rgba(255,255,255,0.06)"/>
  <circle cx="80" cy="220" r="4" fill="#EF4444"/>
  <circle cx="96" cy="220" r="4" fill="#F59E0B"/>
  <circle cx="112" cy="220" r="4" fill="#10B981"/>
  <rect x="140" y="210" width="200" height="20" rx="4" fill="rgba(255,255,255,0.08)"/>

  <!-- Mock pricing table rows inside screenshot -->
  <rect x="80" y="270" width="920" height="36" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="80" y="314" width="920" height="36" rx="4" fill="rgba(255,255,255,0.03)"/>
  <rect x="80" y="358" width="920" height="36" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="80" y="402" width="920" height="36" rx="4" fill="rgba(247,127,42,0.12)"/>
  <rect x="80" y="446" width="920" height="36" rx="4" fill="rgba(255,255,255,0.05)"/>
  <rect x="80" y="490" width="920" height="36" rx="4" fill="rgba(255,255,255,0.03)"/>

  <rect x="80" y="256" width="80" height="14" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="200" y="256" width="120" height="14" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="600" y="256" width="60" height="14" rx="3" fill="rgba(255,255,255,0.15)"/>

  <!-- Text over overlay -->
  <rect x="0" y="780" width="4" height="300" fill="#F77F2A"/>
  <text x="80" y="870" font-family="'Georgia','Times New Roman',serif" font-weight="900" font-style="italic" font-size="28" fill="#0D9BAE">Screenshot Treatment</text>
  <text x="80" y="940" font-family="'Trebuchet MS','Arial',sans-serif" font-weight="800" font-size="38" fill="#FFFFFF">Full-bleed + Navy Overlay</text>
  <text x="80" y="1000" font-family="'Trebuchet MS','Arial',sans-serif" font-weight="400" font-size="22" fill="rgba(255,255,255,0.55)">Screenshot sebagai background dengan dark gradient overlay, teks di atas</text>

  <text x="80" y="1060" font-family="'Trebuchet MS','Arial',sans-serif" font-weight="700" font-size="16" fill="rgba(255,255,255,0.35)">Rahman Ramsi</text>
</svg>